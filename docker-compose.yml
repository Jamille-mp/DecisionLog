services:
  mysql:
    image: mysql:8.0
    container_name: decisionlog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-decisionlog_dev_password}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-decisionlog}"
    ports:
      - "3307:3306"
    volumes:
      - decisionlog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: decisionlog-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - decisionlog_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: decisionlog-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - decisionlog_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  decisionlog_mysql_data:
  decisionlog_mongodb_data:
  decisionlog_rabbitmq_data:
