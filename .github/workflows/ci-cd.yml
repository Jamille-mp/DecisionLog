name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validar backend e frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Instalar backend
        working-directory: server
        run: npm ci

      - name: Testar backend
        working-directory: server
        run: npm test

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Audit backend
        working-directory: server
        run: npm audit --omit=dev

      - name: Instalar frontend
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Audit frontend
        working-directory: client
        run: npm audit --omit=dev

      - name: Instalar navegadores Playwright
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        working-directory: client
        run: npm run test:e2e

  deploy-hook:
    name: Disparar deploy opcional
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Vercel deploy hook
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
